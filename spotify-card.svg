<svg width="500" height="175" viewBox="0 0 500 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de fondo oscuro Spotify -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>

    <!-- Gradiente para el vinilo -->
    <radialGradient id="vinyl-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="25%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="75%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <!-- Sombra de la carátula -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1DB954" flood-opacity="0.3"/>
    </filter>

    <style>
      .track-title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .track-artist {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #A7A7A7;
      }
      .playback-time {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #8B949E;
      }
      .status-text {
        font-family: 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #1DB954;
      }

      /* Animación de rotación del vinilo */
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .vinyl-record {
        transform-origin: 75px 87px;
        animation: spin 6s linear infinite;
      }

      /* Animaciones de las barras del ecualizador */
      @keyframes eq1 { 0%, 100% { height: 6px; y: 14px; } 50% { height: 18px; y: 2px; } }
      @keyframes eq2 { 0%, 100% { height: 18px; y: 2px; } 50% { height: 8px; y: 12px; } }
      @keyframes eq3 { 0%, 100% { height: 10px; y: 10px; } 50% { height: 20px; y: 0px; } }
      @keyframes eq4 { 0%, 100% { height: 16px; y: 4px; } 50% { height: 6px; y: 14px; } }

      .bar1 { animation: eq1 0.8s ease-in-out infinite; }
      .bar2 { animation: eq2 0.7s ease-in-out infinite; }
      .bar3 { animation: eq3 0.9s ease-in-out infinite; }
      .bar4 { animation: eq4 0.6s ease-in-out infinite; }

      /* Animación de la barra de progreso */
      @keyframes progress {
        0% { width: 40px; }
        50% { width: 180px; }
        100% { width: 260px; }
      }
      .progress-bar-fill {
        animation: progress 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Fondo de la tarjeta -->
  <rect width="500" height="175" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="498.5" height="173.5" rx="15.25" fill="none" stroke="#1DB954" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- DISCO DE VINILO GIRATORIO -->
  <g class="vinyl-record">
    <circle cx="75" cy="87" r="54" fill="url(#vinyl-grad)" stroke="#333" stroke-width="1"/>
    <!-- Surcos del vinilo -->
    <circle cx="75" cy="87" r="46" fill="none" stroke="#222" stroke-width="0.8" stroke-dasharray="8 3"/>
    <circle cx="75" cy="87" r="38" fill="none" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="75" cy="87" r="30" fill="none" stroke="#1f1f1f" stroke-width="0.8" stroke-dasharray="12 4"/>
    <!-- Centro del vinilo -->
    <circle cx="75" cy="87" r="18" fill="#1DB954"/>
    <circle cx="75" cy="87" r="6" fill="#0d1117"/>
  </g>

  <!-- CARÁTULA DEL ÁLBUM -->
  <g filter="url(#glow)">
    <rect x="25" y="37" width="100" height="100" rx="10" fill="#181818" stroke="#30363d"/>
    <!-- Arte del álbum (Cyberpunk / Lo-Fi Sunset) -->
    <defs>
      <linearGradient id="art-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F2FE"/>
        <stop offset="50%" stop-color="#4FACFE"/>
        <stop offset="100%" stop-color="#6C5CE7"/>
      </linearGradient>
    </defs>
    <rect x="27" y="39" width="96" height="96" rx="8" fill="url(#art-grad)"/>
    <!-- Sol de Synthwave -->
    <circle cx="75" cy="80" r="26" fill="#FFEAA7" opacity="0.9"/>
    <!-- Montañas / Rejilla -->
    <path d="M35 125 L65 95 L85 115 L105 85 L120 125 Z" fill="#161b22" opacity="0.8"/>
    <path d="M27 115 H123" stroke="#FFEAA7" stroke-width="1.5" opacity="0.7"/>
    <path d="M27 122 H123" stroke="#FFEAA7" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- HEADER SPOTIFY & STATUS -->
  <g transform="translate(150, 32)">
    <!-- Logo Spotify -->
    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z" fill="#1DB954" transform="scale(0.85)"/>
    <text x="28" y="15" class="status-text">SPOTIFY NOW PLAYING</text>

    <!-- ECUALIZADOR DINÁMICO -->
    <g transform="translate(260, 0)">
      <rect x="0" y="2" width="3.5" height="18" rx="1.5" fill="#1DB954" class="bar1"/>
      <rect x="6" y="2" width="3.5" height="18" rx="1.5" fill="#00F2FE" class="bar2"/>
      <rect x="12" y="2" width="3.5" height="18" rx="1.5" fill="#1DB954" class="bar3"/>
      <rect x="18" y="2" width="3.5" height="18" rx="1.5" fill="#00F2FE" class="bar4"/>
    </g>
  </g>

  <!-- INFORMACIÓN DEL TRACK -->
  <g transform="translate(150, 72)">
    <text x="0" y="0" class="track-title">Midnight Coding • Synthwave Lo-Fi</text>
    <text x="0" y="20" class="track-artist">Yahir Becerril • Coding Sessions Playlist</text>
  </g>

  <!-- CONTROLES & BARRA DE PROGRESO -->
  <g transform="translate(150, 115)">
    <!-- Barra de fondo -->
    <rect x="0" y="6" width="280" height="5" rx="2.5" fill="#30363d"/>
    <!-- Barra activa animada -->
    <rect x="0" y="6" width="165" height="5" rx="2.5" fill="#1DB954" class="progress-bar-fill"/>
    <!-- Indicador circular -->
    <circle cx="165" cy="8.5" r="4.5" fill="#FFFFFF"/>

    <!-- Tiempos -->
    <text x="0" y="24" class="playback-time">02:45</text>
    <text x="250" y="24" class="playback-time">04:20</text>

    <!-- Iconos de control -->
    <g transform="translate(100, 14)" fill="#A7A7A7">
      <!-- Prev -->
      <path d="M0 8 L7 3 L7 13 Z M8 8 L15 3 L15 13 Z"/>
      <!-- Pause -->
      <rect x="22" y="3" width="3.5" height="10" rx="1" fill="#FFFFFF"/>
      <rect x="29" y="3" width="3.5" height="10" rx="1" fill="#FFFFFF"/>
      <!-- Next -->
      <path d="M49 8 L42 3 L42 13 Z M41 8 L34 3 L34 13 Z" transform="translate(8, 0)"/>
    </g>
  </g>
</svg>
